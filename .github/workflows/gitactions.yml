name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'stage'
        type: choice
        options: [ example, stage, prod ]
      suite:
        description: 'Test suite'
        required: true
        default: 'e2e'
        type: choice
        options: [ e2e, smoke, regression ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Run Playwright tests
      env:
        ENV: ${{ github.event.inputs.env || 'stage' }}
      run: npm run test:${{ github.event.inputs.env || 'stage' }}:${{ github.event.inputs.suite || 'e2e' }} -- --project=chromium

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: npx allure generate allure-results -o allure-report --clean

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
