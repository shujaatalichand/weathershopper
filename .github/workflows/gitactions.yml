name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'prod'
        type: choice
        options: [ example, stage, prod ]
      suite:
        description: 'Test suite'
        required: true
        default: 'e2e'
        type: choice
        options: [ e2e, smoke, regression ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install

    - name: Run Playwright tests
      run: |
        SUITE="${{ github.event.inputs.suite || 'e2e' }}"
        TAG_ARG=""
        if [ "$SUITE" != "e2e" ]; then
          TAG_ARG="--tag=$SUITE"
        fi
        npm test -- --env=${{ github.event.inputs.env || 'prod' }} $TAG_ARG --project=chromium

    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: npx allure generate allure-results -o allure-report --clean

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Publishing to GitHub Pages: only for pushes to main (not PRs), so
    # PR runs don't fight over the gh-pages branch or leak PR results publicly.
    - name: Fetch existing Allure history
      uses: actions/checkout@v4
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Build Allure report with trend history
      uses: simple-elf/allure-report-action@master
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      with:
        allure_results: allure-results
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20

    - name: Publish Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
